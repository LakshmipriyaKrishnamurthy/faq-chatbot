services:

  neuro-san:
    build:
      context: .
      dockerfile: Dockerfile.neurosan
    container_name: faq-neurosan
    env_file:
      - .env
    ports:
      - "8080:8080"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: faq-backend
    environment:
      NEURO_SAN_URL: http://neuro-san:8080/api/v1/generated/xyz_bank_faq_chatbot/streaming_chat
    ports:
      - "8000:8000"
    depends_on:
      - neuro-san

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: faq-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend